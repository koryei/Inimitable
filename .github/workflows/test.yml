name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Examples pass their own checks
        run: |
          node scripts/signs.mjs examples/landing/after.html
          node scripts/check.mjs examples/landing/after.html
          node scripts/signs.mjs examples/dashboard/after.html
          node scripts/check.mjs examples/dashboard/after.html --widths 320,390,1440,2560
          node scripts/term-shot.mjs --cols 60 --out /tmp/shots -- node examples/terminal/after.mjs
