name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'examples/**', 'assets/recipes/**', 'scripts/dotify.mjs', 'scripts/lib/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build.mjs
      - name: The site must pass the skill's own checks before it is published
        run: |
          node scripts/signs.mjs site/dist/index.html --allow "Uppercase tracked label,Hue-to-hue gradient"
          node scripts/check.mjs site/dist/index.html --widths 320,390,1440,2560
          node scripts/craft.mjs site/dist/index.html --widths 390,1440
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
