<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sloppy fixture</title>
<style>
  body { margin: 0; font-family: Inter, sans-serif; background: #0f0c29; color: #e9d5ff; }
  .hero { padding: 13px 7px 31px; text-align: center; }
  h1 { font-size: 61px; font-weight: 900; background: linear-gradient(90deg, #8b5cf6, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .badge { display: inline-block; padding: 3px 11px; border-radius: 9999px; background: #4c1d95; box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }
  .cta { display: inline-block; margin-top: 17px; padding: 9px 14px; border-radius: 9999px; background: linear-gradient(90deg, #8b5cf6, #3b82f6); color: #fff; transition: all 0.3s; animation: pulse 2s infinite; border: 0; font-size: 14px; }
  .muted { color: #6b5b8a; font-size: 10px; }
  .wide { width: 520px; background: #1e1b4b; }
  .bare { outline: none; border: 0; background: #1e1b4b; color: #e9d5ff; padding: 12px 16px; margin: 8px; }
  @keyframes pulse { 50% { opacity: 0.6; } }
</style>
</head>
<body>
  <div class="hero">
    <span class="badge">✨ Introducing Nova 2.0</span>
    <h1>Supercharge your workflow with AI!</h1>
    <p class="muted">Loved by 10,000+ teams. Unlock the magic.</p>
    <button class="cta">Get started 🚀</button>
    <div class="wide">This box is wider than a small phone.</div>
    <button class="bare">Submit</button>
    <p class="error">Oops! Something went wrong.</p>
    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
  </div>
</body>
</html>
