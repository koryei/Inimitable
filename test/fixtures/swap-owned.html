<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Example</title>
<style>body{margin:0;font:16px system-ui;background:#f4f1ea;color:#17150f}main{max-width:60rem;margin:0 auto;padding:6rem 1.5rem}h1{font-size:3.5rem;margin:0 0 1rem}</style></head>
<body><main>
<h1>Every clause checked against your firm's own position</h1>
<p>Marrow marks the clause, drafts the redline, and a lawyer approves it.</p>
<figure style="width:30rem;height:16rem;background:#ddd;margin:2rem 0 0">
  <svg viewBox="0 0 300 150" width="100%" height="100%" role="img" aria-label="Example: clause 4.2 marked against the firm's standard, with a suggested redline">
    <rect width="300" height="150" fill="#eee"/>
    <text x="12" y="40" font-size="14">4.2 Limitation of liability</text>
    <text x="12" y="70" font-size="12">Suggested redline: cap at 12 months of fees</text>
  </svg>
</figure>
</main></body></html>
