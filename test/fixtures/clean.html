<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean fixture</title>
<style>
  body { margin: 0; font: 400 16px/1.5 system-ui, sans-serif; background: #141415; color: #ededed; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 36px; line-height: 1.15; font-weight: 500; margin: 0 0 16px; }
  p { color: #a1a1a6; margin: 0 0 24px; }
  a.button { display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 10px; background: #ededed; color: #141415; text-decoration: none; transition: background-color 160ms; }
  a.button:hover { background: #ffffff; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }
</style>
</head>
<body>
<main>
  <h1>Your invoices, paid on time</h1>
  <p>Send, track and reconcile invoices without leaving your inbox.</p>
  <a class="button" href="#start">Start free</a>
</main>
</body>
</html>
