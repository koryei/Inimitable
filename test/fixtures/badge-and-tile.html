<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Badge and tile</title>
<style>
  body { margin: 0; font: 16px/24px system-ui, sans-serif; background: #0e0d12; color: #f1efe9; padding: 48px; }
  .tile { display: inline-block; width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #8b5cf6, #ec4899); vertical-align: middle; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid #fff4; border-radius: 999px; margin-bottom: 24px; }
  h1 { font-size: 56px; margin: 0; }
</style></head>
<body><header><span class="tile"></span> Brand</header><main><div><span class="pill">● Introducing version two</span></div><h1>A plain headline</h1></main></body></html>
